name: Deploy Web Frontend

on:
  push:
    branches:
      - web_prod

jobs:
  # ── Step 1: Build & Test in CI (Guarantees zero broken builds reach VPS) ──
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build Web (production)
        run: |
          export NEXT_TELEMETRY_DISABLED=1
          npm run build:production

      - name: Package Build Output
        run: |
          tar -czf web-build.tgz apps/web/.next

      - name: Upload Build Bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "web-build.tgz"
          target: "/var/www/schoolconnectAI/"

  # ── Step 2: Deploy to VPS (Runs ONLY if CI build succeeded) ──
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m

          script: |
            set -e

            APP_DIR="/var/www/schoolconnectAI"
            PM2_NAME="schoolconnect-production"

            echo "═══ Web Frontend Deployment Started ═══"

            cd $APP_DIR

            echo "» Fetching latest code..."
            git fetch origin web_prod
            git reset --hard origin/web_prod

            echo "» Extracting pre-built bundle..."
            if [ -f "web-build.tgz" ]; then
              tar -xzf web-build.tgz
              rm -f web-build.tgz
            fi

            echo "» Installing production dependencies..."
            npm install --prefer-offline --no-audit --progress=false

            echo "» Restarting PM2 process..."
            pm2 restart $PM2_NAME || pm2 start npm --name "$PM2_NAME" -- run start:production

            echo "» Saving PM2 process list..."
            pm2 save

            echo "═══ Web Frontend Deployment Successful! ═══"


